server:
  port: "${APPLICATION_SERVER_PORT:8083}"

spring:
  datasource:
    url: "${APPLICATION_DB_URL}"
    username: "${APPLICATION_DB_USERNAME}"
    password: "${APPLICATION_DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false

ats:
  demo:
    message: "application-service - PROD"

job-service:
  url: "${JOB_SERVICE_URL}"
candidate-service:
  url: "${CANDIDATE_SERVICE_URL}"
